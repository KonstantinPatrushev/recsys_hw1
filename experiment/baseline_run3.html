<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Lunch Menu Recommender</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
            font-size: 32px;
            font-weight: 700;
        }

        .lunch-display {
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px;
        }

        .lunch-icon {
            font-size: 100px;
            color: #667eea;
            margin-bottom: 20px;
            display: none;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .lunch-icon.active {
            display: block;
        }

        .lunch-name {
            font-size: 40px;
            color: #333;
            font-weight: 700;
            display: none;
            animation: slideUp 0.6s ease-out;
        }

        .lunch-name.active {
            display: block;
        }

        .placeholder-text {
            color: #999;
            font-size: 18px;
            font-weight: 500;
        }

        .placeholder-text.hidden {
            display: none;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(-1px);
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5) rotateZ(-10deg);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateZ(0deg);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ Random Lunch Menu</h1>
        <div class="lunch-display">
            <div class="lunch-icon" id="lunchIcon"></div>
            <div class="lunch-name" id="lunchName"></div>
            <div class="placeholder-text" id="placeholder">Click the button to get a random lunch recommendation!</div>
        </div>
        <button onclick="generateLunch()">Generate Lunch!</button>
    </div>

    <script>
        const lunchMenu = [
            { name: "Pizza", icon: "fas fa-pizza-slice" },
            { name: "Sushi", icon: "fas fa-bowl-rice" },
            { name: "Burger", icon: "fas fa-burger" },
            { name: "Salad", icon: "fas fa-leaf" },
            { name: "Tacos", icon: "fas fa-utensils" },
            { name: "Ramen", icon: "fas fa-bowl-rice" },
            { name: "Sandwich", icon: "fas fa-sandwich" },
            { name: "Pasta", icon: "fas fa-spoon" },
            { name: "Curry", icon: "fas fa-fire" },
            { name: "Steak", icon: "fas fa-drumstick-bite" },
            { name: "Soup", icon: "fas fa-mug-hot" },
            { name: "BBQ", icon: "fas fa-campfire" }
        ];

        function generateLunch() {
            const randomIndex = Math.floor(Math.random() * lunchMenu.length);
            const selectedLunch = lunchMenu[randomIndex];

            const iconElement = document.getElementById('lunchIcon');
            const nameElement = document.getElementById('lunchName');
            const placeholderElement = document.getElementById('placeholder');

            iconElement.innerHTML = '<i class="' + selectedLunch.icon + '"></i>';
            iconElement.className = 'lunch-icon active';

            nameElement.textContent = selectedLunch.name;
            nameElement.className = 'lunch-name active';

            placeholderElement.classList.add('hidden');
        }
    </script>
</body>
</html>
