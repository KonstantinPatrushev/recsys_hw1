<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Lunch Menu Recommender</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .lunch-display {
            margin: 30px 0;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lunch-icon {
            font-size: 80px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .lunch-name {
            font-size: 32px;
            color: #333;
            font-weight: bold;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lunch Recommender</h1>
        <div class="lunch-display">
            <div class="lunch-icon"><i class="fas fa-utensils"></i></div>
            <div class="lunch-name">Pick Your Lunch!</div>
        </div>
        <button onclick="generateLunch()">Generate Lunch!</button>
    </div>

    <script>
        const lunchMenu = [
            { name: "Pizza", icon: "fas fa-pizza-slice" },
            { name: "Sushi", icon: "fas fa-utensils" },
            { name: "Burger", icon: "fas fa-burger" },
            { name: "Salad", icon: "fas fa-bowl-salad" },
            { name: "Tacos", icon: "fas fa-bowl-food" },
            { name: "Ramen", icon: "fas fa-bowl-food" },
            { name: "Sandwich", icon: "fas fa-sandwich" },
            { name: "Pasta", icon: "fas fa-utensils" },
            { name: "Curry", icon: "fas fa-bowl-food" },
            { name: "Steak", icon: "fas fa-drumstick-bite" },
            { name: "Soup", icon: "fas fa-mug-hot" },
            { name: "BBQ", icon: "fas fa-fire" }
        ];

        function generateLunch() {
            const randomIndex = Math.floor(Math.random() * lunchMenu.length);
            const selectedLunch = lunchMenu[randomIndex];

            document.querySelector('.lunch-icon').innerHTML = `<i class="${selectedLunch.icon}"></i>`;
            document.querySelector('.lunch-name').textContent = selectedLunch.name;
        }
    </script>
</body>
</html>
