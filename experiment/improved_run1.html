<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Lunch Menu Recommender</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
            font-size: 2.5em;
        }

        .menu-display {
            margin-bottom: 40px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .menu-icon {
            font-size: 80px;
            color: #667eea;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-name {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            letter-spacing: 1px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            color: #999;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lunch Menu</h1>

        <div class="menu-display">
            <div class="menu-icon" id="menuIcon">
                <i class="fas fa-utensils"></i>
            </div>
            <div class="menu-name" id="menuName">Click to generate!</div>
        </div>

        <button onclick="generateLunch()">Generate Lunch!</button>

        <div class="message">
            Click the button to get a random lunch suggestion
        </div>
    </div>

    <script>
        const lunchMenu = [
            { name: "Pizza", icon: "fas fa-pizza-slice" },
            { name: "Sushi", icon: "fas fa-bowl-food" },
            { name: "Burger", icon: "fas fa-burger" },
            { name: "Salad", icon: "fas fa-bowl-salad" },
            { name: "Tacos", icon: "fas fa-utensils" },
            { name: "Ramen", icon: "fas fa-bowl-food" },
            { name: "Sandwich", icon: "fas fa-sandwich" },
            { name: "Pasta", icon: "fas fa-utensils" },
            { name: "Curry", icon: "fas fa-bowl-food" },
            { name: "Steak", icon: "fas fa-drumstick-bite" },
            { name: "Soup", icon: "fas fa-mug-hot" },
            { name: "BBQ", icon: "fas fa-fire" }
        ];

        function generateLunch() {
            const randomIndex = Math.floor(Math.random() * lunchMenu.length);
            const selectedItem = lunchMenu[randomIndex];

            document.getElementById('menuIcon').innerHTML = `<i class="${selectedItem.icon}"></i>`;
            document.getElementById('menuName').textContent = selectedItem.name;
        }
    </script>
</body>
</html>
