<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Lunch Menu Recommender</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .menu-item {
            margin: 30px 0;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .menu-icon {
            font-size: 80px;
            color: #667eea;
            margin-bottom: 15px;
            display: block;
            transition: transform 0.3s ease;
        }

        .menu-icon.animate {
            animation: spin 0.6s ease-in-out;
        }

        @keyframes spin {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(0deg); }
        }

        .menu-name {
            font-size: 2em;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            min-height: 30px;
        }

        .menu-status {
            color: #999;
            font-size: 0.95em;
            min-height: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ Lunch Picker</h1>
        <p class="subtitle">Can't decide? Let fate choose!</p>

        <div class="menu-item">
            <i class="menu-icon fas fa-utensils"></i>
            <div class="menu-name" id="menuName">What's for lunch?</div>
            <div class="menu-status" id="menuStatus"></div>
        </div>

        <button onclick="generateLunch()">Generate Lunch!</button>
    </div>

    <script>
        const lunchMenu = [
            { name: "Pizza", icon: "fas fa-pizza-slice" },
            { name: "Sushi", icon: "fas fa-fish" },
            { name: "Burger", icon: "fas fa-burger" },
            { name: "Salad", icon: "fas fa-leaf" },
            { name: "Tacos", icon: "fas fa-utensils" },
            { name: "Ramen", icon: "fas fa-bowl-rice" },
            { name: "Sandwich", icon: "fas fa-bread-slice" },
            { name: "Pasta", icon: "fas fa-spoon" },
            { name: "Curry", icon: "fas fa-bowl-food" },
            { name: "Steak", icon: "fas fa-drumstick-bite" },
            { name: "Soup", icon: "fas fa-bowl-food" },
            { name: "BBQ", icon: "fas fa-fire" }
        ];

        function generateLunch() {
            const randomIndex = Math.floor(Math.random() * lunchMenu.length);
            const selectedItem = lunchMenu[randomIndex];

            const menuNameElement = document.getElementById('menuName');
            const menuIconElement = document.querySelector('.menu-icon');
            const menuStatusElement = document.getElementById('menuStatus');

            // Add animation
            menuIconElement.classList.remove('animate');
            void menuIconElement.offsetWidth; // Trigger reflow
            menuIconElement.classList.add('animate');

            menuNameElement.textContent = selectedItem.name;
            menuIconElement.className = 'menu-icon ' + selectedItem.icon + ' animate';
            menuStatusElement.textContent = '✨ Delicious choice! ✨';
        }
    </script>
</body>
</html>
