<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Lunch Menu Recommender</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .button-container {
            margin: 30px 0;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 40px;
            padding: 40px 30px;
            background: #f8f9fa;
            border-radius: 15px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .icon {
            font-size: 5em;
            color: #667eea;
        }

        .lunch-name {
            font-size: 2.2em;
            color: #333;
            font-weight: bold;
        }

        .placeholder {
            color: #999;
            font-size: 1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lunch Menu Recommender</h1>
        <p class="subtitle">Can't decide what to eat?</p>

        <div class="button-container">
            <button onclick="generateLunch()">Generate Lunch!</button>
        </div>

        <div class="result" id="result">
            <p class="placeholder">Click the button to get your random lunch!</p>
        </div>
    </div>

    <script>
        const lunchMenu = [
            { name: "Pizza", icon: "fas fa-pizza-slice" },
            { name: "Sushi", icon: "fas fa-fish" },
            { name: "Burger", icon: "fas fa-burger" },
            { name: "Salad", icon: "fas fa-leaf" },
            { name: "Tacos", icon: "fas fa-fire" },
            { name: "Ramen", icon: "fas fa-bowl-rice" },
            { name: "Sandwich", icon: "fas fa-sandwich" },
            { name: "Pasta", icon: "fas fa-spoon" },
            { name: "Curry", icon: "fas fa-pepper-hot" },
            { name: "Steak", icon: "fas fa-drumstick" },
            { name: "Soup", icon: "fas fa-mug-hot" },
            { name: "BBQ", icon: "fas fa-fire" }
        ];

        function generateLunch() {
            const randomIndex = Math.floor(Math.random() * lunchMenu.length);
            const selectedLunch = lunchMenu[randomIndex];

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <div class="icon"><i class="${selectedLunch.icon}"></i></div>
                <div class="lunch-name">${selectedLunch.name}</div>
            `;
        }
    </script>
</body>
</html>
